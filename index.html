<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>NSU Spring 2026 • Course Offerings</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8fafc;
      --surface: white;
      --text: #0f172a;
      --text-soft: #475569;
      --border: #e2e8f0;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #7c3aed;
      --shadow: 0 4px 15px rgba(0,0,0,0.08);
      --error-bg: #fee2e2;
      --error-text: #991b1b;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f1f5f9;
      --text-soft: #94a3b8;
      --border: #334155;
      --primary: #818cf8;
      --primary-dark: #6366f1;
      --error-bg: #450a0a;
      --error-text: #fca5a5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background-color 0.4s, color 0.4s;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1.5rem 1rem; /* Reduced padding for mobile */
    }

    header { text-align: center; padding: 1rem 0 2rem; }

    /* --- CLOCK STYLES --- */
    .clock-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: var(--surface);
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary-dark);
      white-space: nowrap; /* Keeps clock on one line */
    }
    
    .time-part { font-variant-numeric: tabular-nums; }
    .date-part {
        color: var(--text-soft);
        font-weight: 400;
        padding-right: 0.6rem;
        border-right: 1px solid var(--border);
        margin-right: 0.2rem;
    }

    h1 {
      font-size: 2.2rem; /* Slightly smaller default */
      font-weight: 700;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
      line-height: 1.2;
    }

    .subtitle { color: var(--text-soft); font-size: 1rem; }

    .top-controls {
      display: flex; flex-wrap: wrap; gap: 1rem;
      justify-content: center; margin: 1.5rem 0 2rem;
    }

    .search-box { position: relative; width: 100%; max-width: 520px; }

    #searchInput {
      width: 100%; padding: 0.8rem 1rem 0.8rem 2.8rem;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface); font-size: 0.95rem; color: var(--text);
      transition: all 0.25s ease;
    }
    #searchInput:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    .search-icon {
      position: absolute; left: 1rem; top: 50%;
      transform: translateY(-50%); color: var(--text-soft);
      font-size: 1.1rem;
    }

    .theme-btn {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.8rem 1.2rem; cursor: pointer;
      font-weight: 500; transition: all 0.25s; color: var(--text);
      white-space: nowrap;
    }

    /* --- MOBILE RESPONSIVE TABLE --- */
    .table-wrapper {
      background: var(--surface); border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      
      /* THIS FIXES THE MOBILE VIEW: */
      overflow-x: auto; 
      -webkit-overflow-scrolling: touch; /* Smooth scroll on iPhone */
      width: 100%;
    }

    table { width: 100%; border-collapse: collapse; min-width: 600px; /* Forces scroll on small screens */ }
    
    th, td { padding: 1rem; text-align: left; font-size: 0.95rem; }
    
    thead th {
      background: var(--primary); color: white;
      font-weight: 600; position: sticky; top: 0; z-index: 10;
      white-space: nowrap; /* Keeps headers on one line */
    }
    
    tbody tr { transition: background 0.2s; }
    tbody tr:nth-child(even) { background-color: rgba(99,102,241,0.03); }
    [data-theme="dark"] tbody tr:nth-child(even) { background-color: rgba(129,140,248,0.07); }
    
    .pagination {
      display: flex; justify-content: center; flex-wrap: wrap;
      gap: 0.4rem; margin: 2rem 0;
    }
    .page-btn {
      min-width: 40px; height: 40px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-weight: 500; cursor: pointer;
      font-size: 0.9rem;
    }
    .page-btn.active {
      background: var(--primary-dark); color: white;
      border-color: var(--primary-dark);
    }

    footer {
      text-align: center; padding: 2rem 0;
      color: var(--text-soft); font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }

    /* --- SPECIFIC MOBILE TWEAKS --- */
    @media (max-width: 600px) {
        h1 { font-size: 1.8rem; }
        .container { padding: 1rem 0.8rem; }
        
        /* Make clock smaller on phone */
        .clock-badge { 
            padding: 0.5rem 1rem; 
            font-size: 0.9rem; 
            margin-bottom: 1rem;
        }
        
        /* Adjust table cells */
        th, td { padding: 0.8rem 0.6rem; font-size: 0.85rem; }
        
        /* Stack controls */
        .top-controls { gap: 0.8rem; }
        .theme-btn { width: 100%; text-align: center; }
    }
  </style>
</head>

const ITEMS_PER_PAGE = 50;
  let currentPage = 1;
  let filteredData = [...courseData];

  const tableBody = document.getElementById('tableBody');
  const paginationDiv = document.getElementById('pagination');
  const searchInput = document.getElementById('searchInput');
  const themeToggle = document.getElementById('themeToggle');

  // Clock
  function updateClock() {
      const now = new Date();
      const dateOptions = { weekday: 'short', month: 'short', day: 'numeric' };
      const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      
      const dateEl = document.getElementById('dateText');
      const timeEl = document.getElementById('timeText');
      if(dateEl) dateEl.textContent = now.toLocaleDateString('en-US', dateOptions);
      if(timeEl) timeEl.textContent = now.toLocaleTimeString('en-US', timeOptions);
  }
  setInterval(updateClock, 1000);
  updateClock();

  function renderPage(page = 1) {
    tableBody.innerHTML = '';
    
    if (!filteredData || filteredData.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 2rem;">No data found.</td></tr>';
        paginationDiv.innerHTML = '';
        return;
    }

    const start = (page - 1) * ITEMS_PER_PAGE;
    const end = start + ITEMS_PER_PAGE;
    const pageItems = filteredData.slice(start, end);

    pageItems.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.sl || ''}</td>
        <td><strong>${item.course_code || ''}</strong></td>
        <td>${item.section || ''}</td>
        <td>${item.faculty || ''}</td>
        <td style="white-space: nowrap;">${item.time || ''}</td>
        <td>${item.room || ''}</td>
        <td>${item.capacity || ''}</td>
      `;
      tableBody.appendChild(tr);
    });
  }

  function renderPagination() {
    paginationDiv.innerHTML = '';
    const totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE);
    if (totalPages <= 1) return;

    let startPage = Math.max(1, currentPage - 1);
    let endPage = Math.min(totalPages, currentPage + 1);

    if (startPage > 1) addPageButton(1);
    if (startPage > 2) addDots();

    for (let i = startPage; i <= endPage; i++) {
      addPageButton(i);
    }

    if (endPage < totalPages - 1) addDots();
    if (endPage < totalPages) addPageButton(totalPages);
  }

  function addPageButton(i) {
      const btn = document.createElement('button');
      btn.className = 'page-btn';
      btn.textContent = i;
      if (i === currentPage) btn.classList.add('active');
      btn.addEventListener('click', () => {
        currentPage = i;
        renderPage(currentPage);
        renderPagination();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      paginationDiv.appendChild(btn);
  }

  function addDots() {
      const span = document.createElement('span');
      span.textContent = '...';
      span.style.padding = '0 5px';
      span.style.alignSelf = 'center';
      paginationDiv.appendChild(span);
  }

  function filterCourses() {
    const query = searchInput.value.toLowerCase().trim();
    filteredData = courseData.filter(item => {
      const code = String(item.course_code || '').toLowerCase();
      const fac = String(item.faculty || '').toLowerCase();
      const time = String(item.time || '').toLowerCase();
      return code.includes(query) || fac.includes(query) || time.includes(query);
    });
    currentPage = 1;
    renderPage(currentPage);
    renderPagination();
  }

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    themeToggle.textContent = next === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
  });

  searchInput.addEventListener('input', filterCourses);

  renderPage(1);
  renderPagination();
</script>
